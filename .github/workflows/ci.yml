name: Signal CSS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run lint
      - run: npm run build
      - run: npm pack ./packages/signal-css --dry-run
      - run: npm pack ./packages/signal-css --pack-destination "$RUNNER_TEMP"
